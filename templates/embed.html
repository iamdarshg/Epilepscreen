{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Epilepscreen</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; background: #000; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .embed-wrap {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            overflow: hidden;
        }
        .embed-wrap.portrait {
            padding-top: 0;
            height: 100vh;
            max-width: 56.25vh;
        }
        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
        }
        .brand {
            position: absolute;
            bottom: 8px; left: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.5);
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="embed-wrap" id="embedWrap">
        <video id="embedPlayer" controls crossorigin="anonymous" src="{{ stream_url }}"></video>
        <div class="brand">guarded by epilepscreen</div>
    </div>
    <script src="{% static 'epilepscreen/epilepscreen.js' %}"></script>
    <script>
        var video = document.getElementById('embedPlayer');
        window.Epilepscreen.attach(video, {
            eventsUrl: '{{ events_url }}',
            paddingSeconds: 0.2,
            liveDetect: true,
        });
        video.addEventListener('loadedmetadata', function() {
            var wrap = document.getElementById('embedWrap');
            wrap.classList.toggle('portrait', video.videoHeight > video.videoWidth);
        });
    </script>
</body>
</html>

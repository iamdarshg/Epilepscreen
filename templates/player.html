<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }} - Epilepscreen Player</title>
<style>
:root {
--bg-primary: #000000;
--bg-secondary: #141414;
--bg-hover: #1f1f1f;
--text-primary: #ffffff;
--text-secondary: #a3a3a3;
--accent: #e50914;
--accent-hover: #f40612;
--border: #333333;

* { box-sizing: border-box; }

body {
background: var(--bg-primary);
color: var(--text-primary);
font-family: 'Helvetica Neue', Arial, sans-serif;
margin: 0;
padding: 0;
}

/* Header */
.header {
position: fixed;
top: 0; left: 0; right: 0;
background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 100%);
display: flex;
align-items: center;
justify-content: space-between;
padding: 20px 4%;
backdrop-filter: blur(10px);
z-index: 1000;
}

.logo {
font-size: 28px;
font-weight: bold;
color: var(--accent);
text-decoration: none;
}

/* Back to browse button */
.back-btn {
background: transparent;
color: var(--text-secondary);
border: 1px solid var(--border);
padding: 8px 16px;
border-radius: 4px;
cursor: pointer;
font-size: 14px;
transition: all 0.2s;
}

.back-btn:hover {
background: var(--bg-hover);
color: var(--text-primary);
}

/* Main player container */
.player-container {
max-width: 1200px;
margin: 100px auto 0;
padding: 24px;
}

/* Video info section */
.video-info {
display: flex;
gap: 24px;
margin-bottom: 20px;
}

/* Video player frame */
.video-frame {
background: #000;
border-radius: 8px;
overflow: hidden;
flex: 1;
min-width: 0;
}

.video-frame iframe,
.video-frame video,
.video-frame audio {
width: 100%;
height: auto;
min-height: 400px;
}

/* Title and metadata */
.video-title {
font-size: 28px;
font-weight: bold;
margin: 0 0 8px;
}

.video-meta {
font-size: 14px;
color: var(--text-secondary);
display: flex;
gap: 16px;
}

.meta-item {
display: flex;
gap: 4px;
}

/* Action buttons */
.actions {
display: flex;
gap: 12px;
}

.action-btn {
background: var(--bg-hover);
color: var(--text-primary);
border: none;
padding: 10px 16px;
border-radius: 6px;
cursor: pointer;
font-size: 14px;
font-weight: 600;
transition: background 0.2s;
}

.action-btn:hover {
background: var(--border);
}

.action-btn.primary {
background: var(--accent);
color: white;
}

.action-btn.primary:hover {
background: var(--accent-hover);
}

/* Hazard events overlay */
.hazards-list {
background: var(--bg-secondary);
border-radius: 8px;
padding: 16px;
margin-top: 20px;
}

.hazard-item {
background: var(--bg-hover);
border-radius: 6px;
padding: 12px;
margin-bottom: 10px;
padding: 12px;
}

.hazard-item:last-child { margin-bottom: 0; }

.hazard-time {
color: var(--accent);
font-size: 12px;
font-weight: 600;
margin-bottom: 4px;
}

.hazard-desc {
font-size: 13px;
color: var(--text-secondary);
}

/* Store link */
.store-link {
display: inline-block;
background: var(--accent);
color: white;
padding: 10px 20px;
border-radius: 6px;
text-decoration: none;
font-size: 14px;
font-weight: 600;
margin-top: 16px;
}

.store-link:hover {
background: var(--accent-hover);
}

/* Loading state */
.loading {
display: flex;
align-items: center;
justify-content: center;
height: 400px;
color: var(--text-secondary);
}

/* Mobile responsive */
@media (max-width: 768px) {
.header { flex-direction: column;
gap: 12px; }
.video-info { flex-direction: column;
}
}
</style>
</head>
<body>

<div class="header">
<a href="/" class="logo">epilepscreen</a>
<button class="back-btn" onclick="window.history.back()">Back</button>
</div>

<div class="player-container">

<!-- Video info -->
<h1 class="video-title">{{ title }}</h1>

<!-- Video player -->
<div class="video-frame" id="video-frame">
    <div class="loading">Loading video...</div>
    <iframe id="player" src="{{ stream_url }}" loading="lazy" allow="autoplay; fullscreen" style="display:none;"></iframe>
</div>

<!-- Actions -->
<div class="actions">
<button class="action-btn" onclick="document.getElementById('player').play()">▶ Play</button>
<button class="action-btn primary" onclick="window.open('{{ store_url }}', '_blank')">🛒 Video Store</button>
<button class="action-btn" onclick="toggleHazards()">🔔 Hazard Alerts: {{ event_count }}</button>
</div>

<!-- Hazard events display -->
<div id="hazards-container" class="hazards-list" style="display:none;">
<h3>⚠️ Hazard Events</h3>
<!-- Events inserted dynamically -->
</div>

<!-- Store link -->
<a href="{{ store_url }}" class="store-link">🛒 Purchase/Download this video</a>

</div>
<script>
let hazardsEnabled = true;

function toggleHazards() {
const container = document.getElementById('hazards-container');
const currentEvents = document.querySelectorAll('.hazard-item');

if (hazardsEnabled) {
container.style.display = container.style.display === 'none' ? 'block' : 'block';
} else {
container.style.display = 'none';
}
hazardsEnabled = !hazardsEnabled;

// Update button text
const btn = document.querySelector('.actions button:last-child');
btn.innerHTML = hazardsEnabled 
    ? '🔔 Hazard Alerts: {{ event_count }}' 
    : '🔕 Hide Hazard Alerts';
}

// Fetch hazard events if available
fetch('{{ events_url }}').then(res => res.json()).then(data => {
const container = document.getElementById('hazards-container');
const { events } = data;

// Build hazard HTML
const html = events.length ? events.map(e => `
<div class="hazard-item">
<div class="hazard-time">⏱ ${e.start_time.toFixed(2)}s - ${e.end_time.toFixed(2)}s</div>
<div class="hazard-desc">👉 ${e.kind}: ${e.attributes ? JSON.stringify(e.attributes) : 'Event detected'}</div>
</div>`).join('') : '<p style="color:#888;">No hazard events recorded</p>';

container.innerHTML = html;
container.style.display = 'block';
});
</script>

</body>
</html>
